# Generated by agent-kit {{kit_version}}. Kit-owned: regenerate with /bootstrap --upgrade, do not edit by hand.
# Job names are the required status checks for branch protection.
name: kit

on:
  pull_request:
  push:
    branches: [{{default_branch}}]

env:
  KIT_DIR: ${{ github.workspace }}/.kit

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: {{test}}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{typecheck}}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{lint}}

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{boundaries}}

  kit-checks:
    name: kit-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: jonathandrobles805/agents-system
          ref: {{kit_ref}}
          path: .kit
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: scope-diff
        run: python3 $KIT_DIR/kit/scripts/ci_scope_diff.py --repo . --base origin/{{default_branch}}
      - name: test-count
        run: python3 $KIT_DIR/kit/scripts/ci_test_count.py --repo . --base origin/{{default_branch}}
      - name: dep-diff
        run: python3 $KIT_DIR/kit/scripts/ci_dep_diff.py --repo . --base origin/{{default_branch}}
      - name: claude-md-cap
        run: python3 $KIT_DIR/kit/scripts/ci_claude_md_cap.py --repo .
      - name: guards-present
        run: python3 $KIT_DIR/kit/scripts/ci_guards_present.py --repo . --kit $KIT_DIR/kit
      - name: validate-docs
        run: python3 $KIT_DIR/kit/scripts/validate_docs.py --changed --repo . || python3 $KIT_DIR/kit/scripts/ci_changed_docs.py --repo . --base origin/{{default_branch}}
      - name: review-report
        run: python3 $KIT_DIR/kit/scripts/ci_review_report.py --repo .
      - name: pr-size (warning)
        run: python3 $KIT_DIR/kit/scripts/ci_pr_size.py --repo . --base origin/{{default_branch}} || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{audit}}

  mutation:
    name: mutation (threshold {{mutation_threshold}}%)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: {{mutation}}
