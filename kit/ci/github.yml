# Generated by agent-kit {{kit_version}}. Kit-owned: regenerate with /zi-bootstrap --upgrade, do not edit by hand.
# Job names are the required status checks for branch protection.
# A job whose command is not configured fails with an error; one turned off on purpose (kit.json commands.<name>:
# "none: <reason>") passes with a visible warning. No check is green while checking nothing.
# The kit's own checks come from {{kit_repo}} at a pinned ref through its root action (action.yml), which sets KIT_DIR.
# A private kit repository must allow access: its Settings → Actions → General → Access →
# "Accessible from repositories owned by the user".
name: kit

on:
  pull_request:
  merge_group:
  push:
    branches: [{{default_branch}}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: {{kit_repo}}@{{kit_ref}}
{{setup}}
      - name: test
        run: |
{{test}}
      - name: coverage (floor only rises; KIT-SPEC 7.4)
        run: |
{{coverage}}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
{{setup}}
      - name: format
        run: |
{{format}}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
{{setup}}
      - name: integration
        run: |
{{integration}}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
{{setup}}
      - name: typecheck
        run: |
{{typecheck}}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
{{setup}}
      - name: lint
        run: |
{{lint}}

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: {{kit_repo}}@{{kit_ref}}
{{setup}}
      - name: boundaries
        run: |
{{boundaries}}

  kit-checks:
    name: kit-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: {{kit_repo}}@{{kit_ref}}
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: scope-diff
        run: node "$KIT_DIR/scripts/ci_scope_diff.js" --repo . --base origin/{{default_branch}}
      - name: test-count
        run: node "$KIT_DIR/scripts/ci_test_count.js" --repo . --base origin/{{default_branch}}
      - name: dep-diff
        run: node "$KIT_DIR/scripts/ci_dep_diff.js" --repo . --base origin/{{default_branch}}
      - name: claude-md-cap
        run: node "$KIT_DIR/scripts/ci_claude_md_cap.js" --repo .
      - name: guards-present
        run: node "$KIT_DIR/scripts/ci_guards_present.js" --repo . --kit "$KIT_DIR"
      - name: security-floor
        run: node "$KIT_DIR/scripts/ci_security_floor.js" --repo .
      - name: lane-artifacts
        run: node "$KIT_DIR/scripts/ci_lane_artifacts.js" --repo .
      - name: validate-docs
        run: node "$KIT_DIR/scripts/ci_changed_docs.js" --repo . --base origin/{{default_branch}}
      - name: review-report
        # On pull_request, HEAD is GitHub's synthetic merge commit; compare the review with the PR's own head (#69).
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node "$KIT_DIR/scripts/ci_review_report.js" --repo .
      - name: pr-size (warning)
        run: node "$KIT_DIR/scripts/ci_pr_size.js" --repo . --base origin/{{default_branch}} || true

  secrets:
    # The gitleaks binary, pinned by version and checksum, run with a read-only token: no PR comments, no write scopes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: change range
        # The commits this change adds. On pull_request: from the base tip GitHub merged into (the checkout's first
        # parent) to the PR head. Not the event's base.sha: it can name a commit no fetched branch holds (#77).
        # Every end must be in the checkout; a range that cannot be resolved fails here instead of scanning nothing.
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          missing() { echo "::error::secrets: $1 ($2) is not in this checkout, so the change cannot be scanned. The checkout needs fetch-depth: 0."; exit 1; }
          case "$EVENT" in
            pull_request)
              FROM=$(git rev-parse -q --verify 'HEAD^2^{commit}' >/dev/null && git rev-parse HEAD^1 || true)
              [ -n "$FROM" ] || { echo "::error::secrets: HEAD is not GitHub's pull request merge commit; check out the default ref."; exit 1; }
              TO="$PR_HEAD"; have "$TO" || missing "the PR head" "$TO" ;;
            merge_group)
              FROM="$MG_BASE"; TO="$GITHUB_SHA"
              have "$FROM" || missing "the merge queue base" "$FROM" ;;
            *)
              TO="$GITHUB_SHA"
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                FROM="$BEFORE"; have "$FROM" || missing "the commit before the push" "$FROM"
              else
                FROM=""
              fi ;;
          esac
          have "$TO" || missing "the change head" "$TO"
          if [ -n "$FROM" ]; then RANGE="$FROM..$TO"; else RANGE="-1 $TO"; fi
          echo "secrets: scanning $RANGE ($(git rev-list --count ${FROM:+$FROM..}$TO) commit(s))"
          echo "RANGE=$RANGE" >> "$GITHUB_ENV"
      - name: gitleaks (commits in this change)
        run: |
          set -euo pipefail
          V={{gitleaks_version}}
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "{{gitleaks_sha256}}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: {{kit_repo}}@{{kit_ref}}
{{setup}}
      - name: audit
        run: |
{{audit}}

  mutation:
    name: mutation (threshold {{mutation_threshold}}%)
    # Mutation runs are long (10+ minutes on a real repo) and private repos pay per minute. kit.json mutation_in_ci:
    # "manual" (default) runs it only from Actions → kit → Run workflow; "pr" runs it on every change.
    if: {{mutation_if}}
    runs-on: ubuntu-latest
    # Warning-only until {{mutation_blocking_after}} features have merged; then ci_mutation_gate.js makes it blocking.
    continue-on-error: ${{ needs.mutation-gate.outputs.blocking != 'true' }}
    needs: mutation-gate
    steps:
      - uses: actions/checkout@v4
{{setup}}
      - name: mutation
        run: |
{{mutation}}

  mutation-gate:
    runs-on: ubuntu-latest
    outputs:
      blocking: ${{ steps.gate.outputs.blocking }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: {{kit_repo}}@{{kit_ref}}
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - id: gate
        run: node "$KIT_DIR/scripts/ci_mutation_gate.js" --repo . >> "$GITHUB_OUTPUT"

  dashboard:
    name: dashboard (GitHub Pages, opt-in via repository variable KIT_DASHBOARD_PAGES=true)
    if: github.ref == 'refs/heads/{{default_branch}}' && vars.KIT_DASHBOARD_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: {{kit_repo}}@{{kit_ref}}
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          mkdir -p public && cp "$KIT_DIR/dashboard/index.html" public/
          KIT_STATUS_NO_GH=1 node "$KIT_DIR/scripts/kit_status.js" --repo . --out public/status.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
