# Generated by agent-kit {{kit_version}}. Kit-owned: regenerate with /bootstrap --upgrade, do not edit by hand.
# Job names are the required status checks for branch protection.
name: kit

on:
  pull_request:
  push:
    branches: [{{default_branch}}]

env:
  KIT_DIR: ${{ github.workspace }}/.kit

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: {{test}}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{typecheck}}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{lint}}

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jonathandrobles805/agents-system
          ref: {{kit_ref}}
          path: .kit
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: {{boundaries}}

  kit-checks:
    name: kit-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: jonathandrobles805/agents-system
          ref: {{kit_ref}}
          path: .kit
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: scope-diff
        run: node $KIT_DIR/kit/scripts/ci_scope_diff.js --repo . --base origin/{{default_branch}}
      - name: test-count
        run: node $KIT_DIR/kit/scripts/ci_test_count.js --repo . --base origin/{{default_branch}}
      - name: dep-diff
        run: node $KIT_DIR/kit/scripts/ci_dep_diff.js --repo . --base origin/{{default_branch}}
      - name: claude-md-cap
        run: node $KIT_DIR/kit/scripts/ci_claude_md_cap.js --repo .
      - name: guards-present
        run: node $KIT_DIR/kit/scripts/ci_guards_present.js --repo . --kit $KIT_DIR/kit
      - name: security-floor
        run: node $KIT_DIR/kit/scripts/ci_security_floor.js --repo .
      - name: validate-docs
        run: node $KIT_DIR/kit/scripts/validate_docs.js --changed --repo . || node $KIT_DIR/kit/scripts/ci_changed_docs.js --repo . --base origin/{{default_branch}}
      - name: review-report
        run: node $KIT_DIR/kit/scripts/ci_review_report.js --repo .
      - name: pr-size (warning)
        run: node $KIT_DIR/kit/scripts/ci_pr_size.js --repo . --base origin/{{default_branch}} || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: {{audit}}

  mutation:
    name: mutation (threshold {{mutation_threshold}}%)
    runs-on: ubuntu-latest
    # Warning-only until {{mutation_blocking_after}} features have merged; then ci_mutation_gate.js makes it blocking.
    continue-on-error: ${{ needs.mutation-gate.outputs.blocking != 'true' }}
    needs: mutation-gate
    steps:
      - uses: actions/checkout@v4
      - run: {{mutation}}

  mutation-gate:
    runs-on: ubuntu-latest
    outputs:
      blocking: ${{ steps.gate.outputs.blocking }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: jonathandrobles805/agents-system
          ref: {{kit_ref}}
          path: .kit
      - id: gate
        run: node .kit/kit/scripts/ci_mutation_gate.js --repo . >> "$GITHUB_OUTPUT"

  dashboard:
    name: dashboard (GitHub Pages, opt-in via repository variable KIT_DASHBOARD_PAGES=true)
    if: github.ref == 'refs/heads/{{default_branch}}' && vars.KIT_DASHBOARD_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: jonathandrobles805/agents-system
          ref: {{kit_ref}}
          path: .kit
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          mkdir -p public && cp .kit/kit/dashboard/index.html public/
          KIT_STATUS_NO_GH=1 node .kit/kit/scripts/kit_status.js --repo . --out public/status.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - uses: actions/deploy-pages@v4
