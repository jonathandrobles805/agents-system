name: kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: script unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The steps below run even when an earlier step failed, so one failing unit test cannot hide their results.
      # !cancelled() rather than always(): a cancelled run stops here.
      - name: architecture map matches the code (kit/manifest.json declares every component; kit/architecture.json is current)
        if: ${{ !cancelled() }}
        run: npm run architecture:check
      - name: planted-fault suite (every planted fault must be caught)
        if: ${{ !cancelled() }}
        run: node planted-faults/run.js
      - name: settings fragment is valid JSON and references real scripts
        if: ${{ !cancelled() }}
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("kit/hooks/settings.project.json", "utf8"));
          const scripts = new Set(fs.readdirSync("kit/scripts").filter((f) => f.endsWith(".js")));
          const missing = [];
          let n = 0;
          for (const groups of Object.values(s.hooks)) {
            for (const g of groups) {
              for (const h of g.hooks) {
                n++;
                const m = /scripts\/([a-z_]+\.js)/.exec(h.command);
                if (!m || !scripts.has(m[1])) missing.push(h.command);
              }
            }
          }
          if (missing.length) { console.error("missing scripts:", missing); process.exit(1); }
          console.log("settings fragment ok:", n, "hook entries");
          JS
      - name: install.sh is idempotent in a temp home
        if: ${{ !cancelled() }}
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          ./install.sh && ./install.sh
          test -L "$CLAUDE_HOME/agents/implementer.md"
          test -L "$CLAUDE_HOME/kit"
          test -f "$CLAUDE_HOME/kit/dashboard/index.html"
          test "$(ls "$CLAUDE_HOME/agents" | wc -l)" -eq "$(ls kit/agents/*.md | wc -l)"
          test -f "$CLAUDE_HOME/skills/zi-run/SKILL.md" && test -f "$CLAUDE_HOME/skills/zi-plan/SKILL.md"
          test "$(ls "$CLAUDE_HOME/skills" | wc -l)" -eq "$(ls -d kit/skills/*/ | grep -cv -e /domains/ -e /workflows/)"
      - name: install.sh upgrades a kit 0.2.0 install and leaves the user's own commands alone
        if: ${{ !cancelled() }}
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          old="$(mktemp -d)/kit/commands"; mkdir -p "$old" "$CLAUDE_HOME/commands"
          # 0.2.0 linked its commands into ~/.claude/commands (here: links into a kit's commands folder, dangling as after a pull)
          for n in run plan review status bootstrap; do ln -s "$old/$n.md" "$CLAUDE_HOME/commands/$n.md"; done
          # a --copy install left regular files that call the kit's scripts
          printf 'Research, using the scripts in ~/.claude/kit/ \n' > "$CLAUDE_HOME/commands/research.md"
          # the user's own commands, one with a name the kit used to have
          echo "my own sync" > "$CLAUDE_HOME/commands/sync.md"; echo "mine" > "$CLAUDE_HOME/commands/mine.md"
          ./install.sh
          test "$(ls "$CLAUDE_HOME/commands" | sort | tr '\n' ' ')" = "mine.md sync.md "
          test "$(cat "$CLAUDE_HOME/commands/sync.md")" = "my own sync"
          test -f "$CLAUDE_HOME"/kit-backup/commands-*/research.md
          ./install.sh
  # Pull requests: the recorded-fixture self-check only. No credential reaches a pull request, because a PR from a
  # branch in this repo runs its own workflow file with the repo's secrets, and an agent could edit it to read them
  # (0016 E.11 item 3; hardening plan Step 1). The real-agent set runs after the merge, in eval-smoke-main.
  eval-smoke:
    name: eval smoke set (agents, skills, templates, workflows, eval)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: harness self-check with recorded fixtures (proves the gate, not the agents)
        run: node kit/eval/harness.js run --set smoke --runner fixture
      - name: which gated paths this PR touches (the real-agent set runs on main after the merge)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '^kit/(agents|skills|templates|workflows|eval)/' | grep -Ev '^kit/eval/(results|fixtures)/' | tr '\n' ',' || true)
          if [ -n "$FILES" ]; then echo "::notice::this PR changes ${FILES}. The real-agent smoke set runs on main after the merge (eval-smoke-main); to see it before merging, run it locally: npm run eval:smoke -- --runner claude. KIT-SPEC 11A."; else echo "touched: none"; fi

  # main: the real-agent smoke set over what the merge touched, with the credentials from the `main` environment.
  # The environment is limited to the main branch, so no other ref can read the keys. Missing keys fail the job:
  # a silent skip here would mean the real-agent set never runs anywhere in CI.
  eval-smoke-main:
    name: eval smoke set against the real agents (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: main
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: which gated paths this push touches
        id: touched
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE="HEAD~1"; fi
          FILES=$(git diff --name-only "$BEFORE"...HEAD | grep -E '^kit/(agents|skills|templates|workflows|eval)/' | grep -Ev '^kit/eval/(results|fixtures)/' | tr '\n' ',' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "touched: ${FILES:-none}"
      - name: credentials from the main environment (required on every push, touched or not)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::no credential reached this job. Add CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY as a secret of the 'main' environment (Settings → Environments → main). KIT-SPEC 11A."
            exit 1
          fi
      - name: sandbox runtime self-check (bubblewrap needs an unprivileged user namespace; Ubuntu 24.04 restricts it)
        if: steps.touched.outputs.files != ''
        run: |
          sudo apt-get install -y bubblewrap socat
          # what the sandbox runtime needs: a user+pid namespace from bwrap, and a nested user namespace inside it
          # (its seccomp helper unshares again); Ubuntu 24.04 restricts both through AppArmor
          probe() { bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid unshare -Ur true; }
          if probe 2>/tmp/bwrap.err; then
            echo "sandbox: user namespaces ok"
          else
            echo "::warning::bwrap cannot create the namespaces the sandbox needs: $(tr '\n' ' ' </tmp/bwrap.err). Applying the sandbox runtime's documented fix: kernel.apparmor_restrict_unprivileged_userns=0."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            probe 2>/tmp/bwrap.err || { echo "::error::the sandbox still cannot create user namespaces: $(tr '\n' ' ' </tmp/bwrap.err)"; exit 1; }
            echo "sandbox: user namespaces ok after the sysctl"
          fi
      - name: eval smoke set against the real agents
        if: steps.touched.outputs.files != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOUCHED: ${{ steps.touched.outputs.files }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "auth: subscription token"; else echo "auth: API key"; fi
          npm install -g @anthropic-ai/claude-code @anthropic-ai/sandbox-runtime
          node kit/eval/harness.js run --set smoke --runner claude --touched "$TOUCHED" --out "$RUNNER_TEMP/eval-smoke"
      - name: keep the report (each worker session's exit status and stderr tail are in it)
        if: always() && steps.touched.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-main-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-smoke/report.json
          retention-days: 30
          if-no-files-found: warn

  docs:
    name: kit docs validate themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node kit/scripts/validate_docs.js docs/research/claude-code-features.md --repo . --type research
