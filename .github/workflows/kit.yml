name: kit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q kit/scripts/tests
      - name: planted-fault suite (all 19 faults must be caught)
        run: python planted-faults/run.py
      - name: settings fragment is valid JSON and references real scripts
        run: |
          python - <<'PY'
          import json, re, pathlib
          s = json.load(open("kit/hooks/settings.project.json"))
          scripts = set(p.name for p in pathlib.Path("kit/scripts").glob("*.py"))
          missing = []
          for ev, groups in s["hooks"].items():
              for g in groups:
                  for h in g["hooks"]:
                      m = re.search(r"scripts/([a-z_]+\.py)", h["command"])
                      if not m or m.group(1) not in scripts:
                          missing.append((ev, h["command"]))
          assert not missing, missing
          print("settings fragment ok:", sum(len(g["hooks"]) for gs in s["hooks"].values() for g in gs), "hook entries")
          PY
      - name: install.sh is idempotent in a temp home
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          ./install.sh && ./install.sh
          test -L "$CLAUDE_HOME/agents/implementer.md"
          test -L "$CLAUDE_HOME/kit"
          test -f "$CLAUDE_HOME/kit/dashboard/index.html"
          ls "$CLAUDE_HOME/agents" | wc -l | grep -q 7
  docs:
    name: kit docs validate themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python kit/scripts/validate_docs.py docs/research/claude-code-features.md --repo . --type research
