name: kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main are never cancelled (decision 0018).
concurrency:
  group: kit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: script unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every Node major the kit supports (package.json engines); 22 is the minimum since Node 20's end of life (0018)
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The steps below run even when an earlier step failed, so one failing unit test cannot hide their results.
      # !cancelled() rather than always(): a cancelled run stops here.
      - name: architecture map matches the code (kit/manifest.json declares every component; kit/architecture.json is current)
        if: ${{ !cancelled() }}
        run: npm run architecture:check
      - name: planted-fault suite (every planted fault must be caught)
        if: ${{ !cancelled() }}
        run: node planted-faults/run.js
      - name: settings fragment is valid JSON and references real scripts
        if: ${{ !cancelled() }}
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("kit/hooks/settings.project.json", "utf8"));
          const scripts = new Set(fs.readdirSync("kit/scripts").filter((f) => f.endsWith(".js")));
          const missing = [];
          let n = 0;
          for (const groups of Object.values(s.hooks)) {
            for (const g of groups) {
              for (const h of g.hooks) {
                n++;
                const m = /scripts\/([a-z_]+\.js)/.exec(h.command);
                if (!m || !scripts.has(m[1])) missing.push(h.command);
              }
            }
          }
          if (missing.length) { console.error("missing scripts:", missing); process.exit(1); }
          console.log("settings fragment ok:", n, "hook entries");
          JS
      - name: install.sh is idempotent in a temp home
        if: ${{ !cancelled() }}
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          ./install.sh && ./install.sh
          test -L "$CLAUDE_HOME/agents/implementer.md"
          test -L "$CLAUDE_HOME/kit"
          test -f "$CLAUDE_HOME/kit/dashboard/index.html"
          test "$(ls "$CLAUDE_HOME/agents" | wc -l)" -eq "$(ls kit/agents/*.md | wc -l)"
          test -f "$CLAUDE_HOME/skills/zi-run/SKILL.md" && test -f "$CLAUDE_HOME/skills/zi-plan/SKILL.md"
          test "$(ls "$CLAUDE_HOME/skills" | wc -l)" -eq "$(ls -d kit/skills/*/ | grep -cv -e /domains/ -e /workflows/)"
      - name: install.sh upgrades a kit 0.2.0 install and leaves the user's own commands alone
        if: ${{ !cancelled() }}
        run: |
          export CLAUDE_HOME="$(mktemp -d)"
          old="$(mktemp -d)/kit/commands"; mkdir -p "$old" "$CLAUDE_HOME/commands"
          # 0.2.0 linked its commands into ~/.claude/commands (here: links into a kit's commands folder, dangling as after a pull)
          for n in run plan review status bootstrap; do ln -s "$old/$n.md" "$CLAUDE_HOME/commands/$n.md"; done
          # a --copy install left regular files that call the kit's scripts
          printf 'Research, using the scripts in ~/.claude/kit/ \n' > "$CLAUDE_HOME/commands/research.md"
          # the user's own commands, one with a name the kit used to have
          echo "my own sync" > "$CLAUDE_HOME/commands/sync.md"; echo "mine" > "$CLAUDE_HOME/commands/mine.md"
          ./install.sh
          test "$(ls "$CLAUDE_HOME/commands" | sort | tr '\n' ' ')" = "mine.md sync.md "
          test "$(cat "$CLAUDE_HOME/commands/sync.md")" = "my own sync"
          test -f "$CLAUDE_HOME"/kit-backup/commands-*/research.md
          ./install.sh
  # Pull requests: the recorded-fixture self-check only. No credential reaches a pull request, because a PR from a
  # branch in this repo runs its own workflow file with the repo's secrets, and an agent could edit it to read them
  # (0016 E.11 item 3; hardening plan Step 1). The real-agent set runs after the merge, in eval-smoke-main.
  eval-smoke:
    name: eval smoke set (agents, skills, templates, workflows, eval)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: harness self-check with recorded fixtures (proves the gate, not the agents)
        run: node kit/eval/harness.js run --set smoke --runner fixture
      - name: which gated paths this PR touches (the real-agent set runs on main after the merge)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '^kit/(agents|skills|templates|workflows|eval)/' | grep -Ev '^kit/eval/(results|fixtures)/' | tr '\n' ',' || true)
          if [ -n "$FILES" ]; then echo "::notice::this PR changes ${FILES}. The real-agent smoke set runs on main after the merge (kit-eval-main.yml, only when these paths change); to see it before merging, run it locally: npm run eval:smoke -- --runner claude. KIT-SPEC 11A."; else echo "touched: none"; fi

  docs:
    name: kit docs validate themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node kit/scripts/validate_docs.js docs/research/claude-code-features.md --repo . --type research
