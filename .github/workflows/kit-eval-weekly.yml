name: kit eval weekly

on:
  schedule:
    # weekly, not nightly: on a subscription the full set (all tasks, n=3) draws on the same usage limits as your own
    # work; run it by hand (workflow_dispatch) before tagging a release. KIT-SPEC 11A.
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: eval full set (n=3) against the committed baseline
    runs-on: ubuntu-latest
    # Credentials come from the `main` environment, which only the main branch can use (0016 E.11 item 3).
    # A scheduled run uses the default branch, so it qualifies; a missing key fails instead of skipping.
    environment: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: credentials from the main environment (required; subscription token preferred)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::no credential reached this job. Add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a secret of the 'main' environment. KIT-SPEC 11A."; exit 1; fi
      - name: sandbox runtime self-check (bubblewrap needs an unprivileged user namespace; Ubuntu 24.04 restricts it)
        run: |
          sudo apt-get install -y bubblewrap socat
          # what the sandbox runtime needs: a user+pid namespace from bwrap, and a nested user namespace inside it
          # (its seccomp helper unshares again); Ubuntu 24.04 restricts both through AppArmor
          probe() { bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid unshare -Ur true; }
          if probe 2>/tmp/bwrap.err; then
            echo "sandbox: user namespaces ok"
          else
            echo "::warning::bwrap cannot create the namespaces the sandbox needs: $(tr '\n' ' ' </tmp/bwrap.err). Applying the sandbox runtime's documented fix: kernel.apparmor_restrict_unprivileged_userns=0."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            probe 2>/tmp/bwrap.err || { echo "::error::the sandbox still cannot create user namespaces: $(tr '\n' ' ' </tmp/bwrap.err)"; exit 1; }
            echo "sandbox: user namespaces ok after the sysctl"
          fi
      - run: npm install -g @anthropic-ai/claude-code @anthropic-ai/sandbox-runtime
      - name: full set
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; fi
          BASE=kit/eval/baselines/$(cat VERSION).json
          if [ -f "$BASE" ]; then node kit/eval/harness.js run --set full --runner claude --n 3 --baseline "$BASE" --out eval-out; else node kit/eval/harness.js run --set full --runner claude --n 3 --out eval-out; echo "no baseline for $(cat VERSION) yet; this run's report can become it: harness.js baseline --from eval-out/report.json --out $BASE"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: eval-out/report.json
